name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore JamfDotNet.slnx

      - name: Build
        run: dotnet build JamfDotNet.slnx -c Release --no-restore

      - name: Test
        run: dotnet test JamfDotNet.slnx -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack JamfDotNet.slnx -c Release --no-build

  live-smoke:
    name: Live smoke (optional)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore JamfDotNet.slnx

      - name: Build
        run: dotnet build JamfDotNet.slnx -c Release --no-restore

      - name: Live smoke tests
        env:
          JAMF_URL: ${{ secrets.JAMF_URL }}
          JAMF_CLIENT_ID: ${{ secrets.JAMF_CLIENT_ID }}
          JAMF_CLIENT_SECRET: ${{ secrets.JAMF_CLIENT_SECRET }}
          JAMF_PLATFORM_URL: ${{ secrets.JAMF_PLATFORM_URL }}
          JAMF_PLATFORM_CLIENT_ID: ${{ secrets.JAMF_PLATFORM_CLIENT_ID }}
          JAMF_PLATFORM_CLIENT_SECRET: ${{ secrets.JAMF_PLATFORM_CLIENT_SECRET }}
          JAMF_PLATFORM_TENANT_ID: ${{ secrets.JAMF_PLATFORM_TENANT_ID }}
          JAMF_PROTECT_URL: ${{ secrets.JAMF_PROTECT_URL }}
          JAMF_PROTECT_CLIENT_ID: ${{ secrets.JAMF_PROTECT_CLIENT_ID }}
          JAMF_PROTECT_CLIENT_SECRET: ${{ secrets.JAMF_PROTECT_CLIENT_SECRET }}
          JAMF_SCHOOL_URL: ${{ secrets.JAMF_SCHOOL_URL }}
          JAMF_SCHOOL_NETWORK_ID: ${{ secrets.JAMF_SCHOOL_NETWORK_ID }}
          JAMF_SCHOOL_API_KEY: ${{ secrets.JAMF_SCHOOL_API_KEY }}
          JAMF_TITLE_EDITOR_URL: ${{ secrets.JAMF_TITLE_EDITOR_URL }}
          JAMF_TITLE_EDITOR_USERNAME: ${{ secrets.JAMF_TITLE_EDITOR_USERNAME }}
          JAMF_TITLE_EDITOR_PASSWORD: ${{ secrets.JAMF_TITLE_EDITOR_PASSWORD }}
        run: dotnet test JamfDotNet.slnx -c Release --no-build --filter "FullyQualifiedName~LiveSmoke" --verbosity normal
