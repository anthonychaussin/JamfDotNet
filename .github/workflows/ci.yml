name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore JamfDotNet.slnx

      - name: Build
        run: dotnet build JamfDotNet.slnx -c Release --no-restore

      - name: Test
        run: dotnet test JamfDotNet.slnx -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack JamfDotNet.slnx -c Release --no-build
